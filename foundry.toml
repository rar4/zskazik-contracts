[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 1000
via_ir = false
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[fuzz]
runs = 1000

[invariant]
runs = 512
depth = 25
